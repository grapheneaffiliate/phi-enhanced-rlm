<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phi-Enhanced RLM Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
header{background:#16213e;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0f3460}
header h1{font-size:1.3rem;color:#e94560;letter-spacing:1px}
.conn{display:flex;align-items:center;gap:10px}
.conn label{font-size:.85rem;color:#8a8a9a}
.conn input{background:#1a1a2e;border:1px solid #0f3460;color:#e0e0e0;padding:6px 12px;border-radius:4px;width:260px;font-size:.85rem}
.conn input:focus{outline:none;border-color:#e94560}
.status-dot{width:10px;height:10px;border-radius:50%;background:#555;flex-shrink:0}
.status-dot.ok{background:#4caf50}
.status-dot.err{background:#e94560}
.controls{display:flex;gap:8px;align-items:center}
.controls button{background:#0f3460;color:#e0e0e0;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:.8rem}
.controls button:hover{background:#e94560}
.controls span{font-size:.75rem;color:#8a8a9a}
#auto-toggle{cursor:pointer;accent-color:#e94560}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:#16213e;border-radius:8px;border:1px solid #0f3460;overflow:hidden}
.card-head{background:#0f3460;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.card-head h2{font-size:.95rem;font-weight:600}
.card-head .ts{font-size:.7rem;color:#8a8a9a}
.card-body{padding:16px;min-height:120px;position:relative}
.card-body.disconnected::after{content:'Not connected';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a8a9a;font-size:.9rem;background:#16213ee0}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{width:100px;font-size:.8rem;text-align:right;color:#8a8a9a;flex-shrink:0}
.bar-track{flex:1;height:18px;background:#1a1a2e;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .4s;min-width:2px}
.bar-val{width:50px;font-size:.8rem;text-align:left;flex-shrink:0}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-box{background:#1a1a2e;border-radius:6px;padding:12px;text-align:center}
.stat-box .val{font-size:1.4rem;font-weight:700;color:#e94560}
.stat-box .lbl{font-size:.75rem;color:#8a8a9a;margin-top:4px}
.tree{font-family:'Courier New',monospace;font-size:.82rem;line-height:1.6;max-height:340px;overflow-y:auto;white-space:pre}
.tree::-webkit-scrollbar{width:6px}
.tree::-webkit-scrollbar-thumb{background:#0f3460;border-radius:3px}
.node{padding:1px 0}
.conf-hi{color:#4caf50}.conf-mid{color:#ffc107}.conf-lo{color:#e94560}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:8px 10px;background:#0f3460;color:#e0e0e0;font-weight:600}
td{padding:7px 10px;border-bottom:1px solid #1a1a2e}
tr:hover td{background:#1a1a2e}
.better{color:#4caf50;font-weight:600}
.worse{color:#e94560}
</style>
</head>
<body>
<header>
  <h1>PHI-ENHANCED RLM</h1>
  <div class="conn">
    <label>API</label>
    <input id="api-url" value="http://localhost:8000" spellcheck="false">
    <span class="status-dot" id="conn-dot"></span>
  </div>
  <div class="controls">
    <button onclick="refreshAll()">Refresh All</button>
    <input type="checkbox" id="auto-toggle" checked>
    <span>Auto (5s)</span>
  </div>
</header>
<main>
  <div class="card" id="evo-card">
    <div class="card-head"><h2>Evolution Status</h2><span class="ts" id="evo-ts">--</span></div>
    <div class="card-body disconnected" id="evo-body">
      <div class="stat-grid" id="evo-stats">
        <div class="stat-box"><span class="val" id="evo-gen">--</span><div class="lbl">Generation</div></div>
        <div class="stat-box"><span class="val" id="evo-fit">--</span><div class="lbl">Fitness</div></div>
        <div class="stat-box"><span class="val" id="evo-lr">--</span><div class="lbl">Learning Rate</div></div>
        <div class="stat-box"><span class="val" id="evo-pop">--</span><div class="lbl">Population</div></div>
      </div>
      <div style="margin-top:14px" id="evo-bars"></div>
    </div>
  </div>
  <div class="card" id="tree-card">
    <div class="card-head"><h2>Reasoning Tree</h2><span class="ts" id="tree-ts">--</span></div>
    <div class="card-body disconnected" id="tree-body"><div class="tree" id="tree-view"></div></div>
  </div>
  <div class="card" id="mem-card">
    <div class="card-head"><h2>Memory Stats</h2><span class="ts" id="mem-ts">--</span></div>
    <div class="card-body disconnected" id="mem-body">
      <div class="stat-grid" id="mem-stats">
        <div class="stat-box"><span class="val" id="mem-total">--</span><div class="lbl">Total Memories</div></div>
        <div class="stat-box"><span class="val" id="mem-radius">--</span><div class="lbl">Avg Radius</div></div>
        <div class="stat-box"><span class="val" id="mem-reads">--</span><div class="lbl">Reads</div></div>
        <div class="stat-box"><span class="val" id="mem-writes">--</span><div class="lbl">Writes</div></div>
      </div>
    </div>
  </div>
  <div class="card" id="bench-card">
    <div class="card-head"><h2>Benchmark Results</h2><span class="ts" id="bench-ts">--</span></div>
    <div class="card-body disconnected" id="bench-body"><div id="bench-table"></div></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const api = () => $('api-url').value.replace(/\/+$/, '');
const ts = () => new Date().toLocaleTimeString();
let timer = null;

async function fetchJSON(path) {
  const r = await fetch(api() + path, {signal: AbortSignal.timeout(4000)});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function setConnected(el, ok) {
  el.classList.toggle('disconnected', !ok);
}

function confClass(c) {
  return c > 0.8 ? 'conf-hi' : c > 0.5 ? 'conf-mid' : 'conf-lo';
}

function renderBars(weights) {
  if (!weights || typeof weights !== 'object') return '';
  let html = '';
  for (const [k, v] of Object.entries(weights)) {
    const pct = Math.min(100, Math.max(0, (v * 100)));
    const color = pct > 60 ? '#4caf50' : pct > 30 ? '#ffc107' : '#e94560';
    html += `<div class="bar-row">
      <span class="bar-label">${k}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <span class="bar-val">${v.toFixed(3)}</span></div>`;
  }
  return html;
}

function renderTree(node, indent) {
  if (!node) return '';
  indent = indent || 0;
  const pad = '  '.repeat(indent);
  const q = node.query || node.question || '';
  const c = node.confidence || 0;
  const cls = confClass(c);
  let line = `${pad}<span class="node"><span class="${cls}">[${c.toFixed(2)}]</span> ${escHtml(q.slice(0, 80))}</span>\n`;
  if (node.children && node.children.length) {
    for (const ch of node.children) line += renderTree(ch, indent + 1);
  }
  return line;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function pollEvolution() {
  try {
    const d = await fetchJSON('/evolution/status');
    setConnected($('evo-body'), true);
    $('evo-ts').textContent = ts();
    $('evo-gen').textContent = d.generation ?? '--';
    $('evo-fit').textContent = typeof d.fitness === 'number' ? d.fitness.toFixed(4) : '--';
    $('evo-lr').textContent = typeof d.learning_rate === 'number' ? d.learning_rate.toFixed(4) : '--';
    $('evo-pop').textContent = d.population ?? d.population_size ?? '--';
    $('evo-bars').innerHTML = renderBars(d.budget_weights);
    $('conn-dot').className = 'status-dot ok';
  } catch {
    setConnected($('evo-body'), false);
    $('conn-dot').className = 'status-dot err';
  }
}

async function pollTree() {
  try {
    const d = await fetchJSON('/reasoning/tree');
    setConnected($('tree-body'), true);
    $('tree-ts').textContent = ts();
    const root = d.tree || d;
    $('tree-view').innerHTML = renderTree(root);
  } catch {
    setConnected($('tree-body'), false);
  }
}

async function pollMemory() {
  try {
    const d = await fetchJSON('/memory/spiral');
    setConnected($('mem-body'), true);
    $('mem-ts').textContent = ts();
    $('mem-total').textContent = d.total_memories ?? d.total ?? '--';
    $('mem-radius').textContent = typeof d.avg_radius === 'number' ? d.avg_radius.toFixed(3) : '--';
    $('mem-reads').textContent = d.reads ?? d.access_reads ?? '--';
    $('mem-writes').textContent = d.writes ?? d.access_writes ?? '--';
  } catch {
    setConnected($('mem-body'), false);
  }
}

async function pollBenchmark() {
  try {
    const d = await fetchJSON('/benchmark/latest');
    setConnected($('bench-body'), true);
    $('bench-ts').textContent = ts();
    const metrics = d.metrics || d.results || d;
    let html = '<table><tr><th>Metric</th><th>Phi</th><th>Vanilla</th><th>Diff</th></tr>';
    for (const [k, v] of Object.entries(metrics)) {
      if (typeof v !== 'object') continue;
      const phi = v.phi ?? v.enhanced ?? 0;
      const van = v.vanilla ?? v.baseline ?? 0;
      const diff = phi - van;
      const cls = diff > 0 ? 'better' : diff < 0 ? 'worse' : '';
      const sign = diff > 0 ? '+' : '';
      html += `<tr><td>${escHtml(k)}</td><td>${phi.toFixed(4)}</td><td>${van.toFixed(4)}</td><td class="${cls}">${sign}${diff.toFixed(4)}</td></tr>`;
    }
    html += '</table>';
    $('bench-table').innerHTML = html;
  } catch {
    setConnected($('bench-body'), false);
  }
}

function refreshAll() {
  pollEvolution();
  pollTree();
  pollMemory();
  pollBenchmark();
}

function startAuto() {
  stopAuto();
  timer = setInterval(refreshAll, 5000);
}

function stopAuto() {
  if (timer) { clearInterval(timer); timer = null; }
}

$('auto-toggle').addEventListener('change', e => {
  e.target.checked ? startAuto() : stopAuto();
});

$('api-url').addEventListener('change', refreshAll);
refreshAll();
startAuto();
</script>
</body>
</html>
