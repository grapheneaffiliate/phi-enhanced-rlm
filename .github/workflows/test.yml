name: Tests

on:
  push:
    branches: [main, master, "claude/*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install sentence-transformers

      - name: Run unit tests
        run: pytest tests/ -v --tb=short -m "not integration"

      - name: Run benchmark tests (mock backend)
        run: pytest tests/test_benchmarks.py -v --tb=short -m "not integration"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/ benchmarks/ --select E,F,W --ignore E501
