[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-enhanced-rlm"
version = "4.1.0"
description = "Self-evolving Recursive Language Model with φ-Geometric Mathematics, Multi-Agent Integration, and Autonomous Tool Use"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Tim McGirl", email = "grapheneaffiliate@users.noreply.github.com"}
]
keywords = ["llm", "nlp", "ai", "recursive", "golden-ratio", "phi", "mathematics", "self-evolving", "e8", "multi-agent", "claude-code-templates"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "openai>=1.0.0",
    "python-dotenv>=0.19.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
full = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "rich>=13.0.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=0.8.11",
    "trafilatura>=1.6.0",
    "tree-sitter>=0.20.0",
    "colorama>=0.4.0",
    "httpx>=0.25.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
benchmark = [
    "datasets>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/grapheneaffiliate/phi-enhanced-rlm"
Repository = "https://github.com/grapheneaffiliate/phi-enhanced-rlm"
Issues = "https://github.com/grapheneaffiliate/phi-enhanced-rlm/issues"

[project.scripts]
phi-rlm = "cli.chat:main"
phi-analyze = "cli.repo_analyzer:main"
phi-evolve = "src.evolution_loop:main"
phi-mcp = "src.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*", "api*", "benchmarks*"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests requiring real API keys (deselect with '-m \"not integration\"')",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
